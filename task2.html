<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <link rel="stylesheet" href="style2.css">
    <script src="task2.js" defer></script>
</head>
<body>
    <main class="board-container">
        <h1>Game Development Tasks</h1>

        <section class="controls">
            <input type="text" id="searchInput" placeholder="Search tasks">
            <select id="tagFilter">
                <option value="all">All tags</option>
                <option value="Design">Design</option>
                <option value="Code">Code</option>
                <option value="Testing">Testing</option>
            </select>
            <select id="sortPriority">
                <option value="default">Default order</option>
                <option value="high">High priority first</option>
                <option value="low">Low priority first</option>
            </select>
        </section>

        <p id="message" aria-live="polite"></p>

        <section class="progress-section">
            <p>Completed: <span id="progressText">0%</span></p>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </section>

        <section id="board" class="board">
            <div class="column" data-status="todo">
                <h2>To Do <span id="todoCount">0</span></h2>
                <div class="task-list" id="todoList"></div>
            </div>

            <div class="column" data-status="progress">
                <h2>In Progress <span id="progressCount">0</span></h2>
                <div class="task-list" id="progressList"></div>
            </div>

            <div class="column" data-status="done">
                <h2>Done <span id="doneCount">0</span></h2>
                <div class="task-list" id="doneList"></div>
            </div>
        </section>
    </main>
</body>
</html>
