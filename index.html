<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Higher or Lower</title>
    <link rel="stylesheet" href="style.css">
    <script src="task1.js" defer></script>
</head>
<body>
    <main class="game">
        <h1>Higher or Lower</h1>
        <p>Will the next number be higher or lower?</p>

        <div class="number-box">
            <span>Current number</span>
            <strong id="currentNumber">--</strong>
        </div>

        <div class="stats">
            <p>Lives: <span id="lives">3</span></p>
            <p>Current streak: <span id="streak">0</span></p>
            <p>Best streak: <span id="bestStreak">0</span></p>
        </div>

        <div class="buttons">
            <button id="higherButton">Higher</button>
            <button id="lowerButton">Lower</button>
        </div>

        <p id="message" aria-live="polite">Press Start Game to play.</p>

        <button id="startButton">Start Game</button>
    </main>
</body>
</html>
