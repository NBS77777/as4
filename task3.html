<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Reserve a Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">

            <h2>Reserve a Table</h2>

            <form action="#" method="get">

                <div class="mb-3">
                    <label for="customerName" class="form-label">Your name</label>
                    <input type="text" class="form-control"
                           id="customerName" name="customerName" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control"
                           id="email" name="email" required>
                </div>

                <div class="mb-3">
                    <label for="phone" class="form-label">Phone</label>
                    <input type="tel" class="form-control"
                           id="phone" name="phone" required>
                </div>

                <div class="mb-3">
                    <label for="guests" class="form-label">Guests</label>
                    <input type="number" class="form-control"
                           id="guests" name="guests"
                           min="1" max="20" step="1" required>
                </div>

                <div class="mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" class="form-control"
                           id="date" name="date" required>
                </div>

                <fieldset class="mb-3">
                    <legend class="form-label">Seating</legend>

                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="seating" id="inside"
                               value="Inside" required>
                        <label for="inside" class="form-check-label">
                            Inside
                        </label>
                    </div>

                    <div class="form-check">
                        <input type="radio" class="form-check-input"
                               name="seating" id="terrace"
                               value="Terrace" required>
                        <label for="terrace" class="form-check-label">
                            Terrace
                        </label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="meal" class="form-label">Meal</label>
                    <select class="form-select" id="meal" name="meal" required>
                        <option value="Lunch">Lunch</option>
                        <option value="Dinner">Dinner</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="comments" class="form-label">Comments</label>
                    <textarea class="form-control"
                              id="comments" name="comments" rows="3"></textarea>
                </div>

                <div class="form-check mb-3">
                    <input type="checkbox" class="form-check-input"
                           id="agreement" name="agreement"
                           value="accepted" required>
                    <label for="agreement" class="form-check-label">
                        I agree to the terms
                    </label>
                </div>

                <button type="submit" class="btn btn-primary">
                    Reserve
                </button>

            </form>

        </div>
    </div>
</div>

</body>
</html>
