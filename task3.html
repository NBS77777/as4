<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Creator</title>
    <link rel="stylesheet" href="style3.css">
    <script src="task3.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Character Creator</h1>

        <form id="characterForm">
            <label for="characterName">Character name</label>
            <input type="text" id="characterName" required minlength="3" maxlength="15">
            <small id="characterNameError" class="error"></small>

            <label for="characterClass">Character class</label>
            <select id="characterClass" required>
                <option value="">Choose a class</option>
                <option value="Warrior">Warrior</option>
                <option value="Mage">Mage</option>
                <option value="Archer">Archer</option>
            </select>
            <small id="characterClassError" class="error"></small>

            <label for="characterColor">Character color</label>
            <input type="color" id="characterColor" value="#7c3aed">

            <h2>Skills</h2>

            <label for="strength">Strength</label>
            <input type="number" id="strength" min="1" max="10" value="5" required>
            <small id="strengthError" class="error"></small>

            <label for="magic">Magic</label>
            <input type="number" id="magic" min="1" max="10" value="5" required>
            <small id="magicError" class="error"></small>

            <label for="agility">Agility</label>
            <input type="number" id="agility" min="1" max="10" value="5" required>
            <small id="agilityError" class="error"></small>

            <label for="defense">Defense</label>
            <input type="number" id="defense" min="1" max="10" value="5" required>
            <small id="defenseError" class="error"></small>

            <p>Skill points left: <strong id="pointsLeft">0</strong></p>

            <div id="formErrors" aria-live="polite"></div>

            <button type="submit">Create Character</button>
        </form>

        <section class="preview">
            <h2>Character Preview</h2>
            <div id="previewCard">
                <h3 id="previewName">Unnamed Character</h3>
                <p>Class: <span id="previewClass">Not selected</span></p>
                <p>Strength: <span id="previewStrength">5</span></p>
                <p>Magic: <span id="previewMagic">5</span></p>
                <p>Agility: <span id="previewAgility">5</span></p>
                <p>Defense: <span id="previewDefense">5</span></p>
            </div>
        </section>

        <section id="result" aria-live="polite"></section>
    </main>
</body>
</html>
